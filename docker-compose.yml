services:
  mongodb:
    image: mongo:latest
    container_name: whatsapp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: whatsapp
    networks:
      - whatsapp-network

volumes:
  mongo-data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
